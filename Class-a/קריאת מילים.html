<style>
:root{--bg:#fef6e4;--card:#fff;--ink:#3a2e39;--accent:#ff8552;--accent2:#43aa8b;--wrong:#e05263;--border:#f2d0a4;--shadow:rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f2e;--card:#332c40;--ink:#f5ecff;--border:#4a3f5c;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#241f2e;--card:#332c40;--ink:#f5ecff;--border:#4a3f5c;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:680px}h1{text-align:center;font-size:1.7rem;margin:.2em 0 .6em}.card{background:var(--card);border-radius:22px;box-shadow:0 8px 24px var(--shadow);padding:22px;text-align:center}.sub{color:var(--accent);font-weight:700}button{font-family:inherit;cursor:pointer;border:none;color:inherit}.big-btn{background:var(--accent);color:#fff;font-size:1.15rem;font-weight:700;padding:14px 28px;border-radius:16px;margin-top:12px}.big-btn:active,.choice:active{transform:scale(.97)}button:focus-visible{outline:3px solid #2878c8;outline-offset:3px}
.group-title{margin:18px 0 8px}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.choice,.category{background:var(--bg);border:3px solid var(--border);border-radius:15px;padding:10px 14px;font-size:1.05rem;font-weight:700}.choice.selected,.category.selected{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,var(--card))}.avatar-choice{font-size:2rem;min-width:76px}.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.category small{display:block;font-size:.8rem;font-weight:400;margin-top:3px}.hint{min-height:1.5em;color:var(--wrong);font-weight:700}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:1.1rem;font-weight:700}.hearts{letter-spacing:2px;font-size:1.2rem}.progress{height:11px;background:var(--border);border-radius:6px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--accent2);transition:width .35s}.trail{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0 18px}.stop{min-height:42px;border-radius:14px;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;position:relative}.stop.done{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 15%,var(--card))}.stop.here{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);transform:scale(1.08);z-index:1}.word-btn{font-size:2.5rem;border-radius:50%;background:var(--accent2);color:white;width:88px;height:88px;box-shadow:0 4px 10px var(--shadow);margin:0 0 14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{background:var(--bg);border:3px solid var(--border);border-radius:16px;padding:18px 6px;font-size:2rem;font-weight:700;color:var(--ink)}.opt.correct{border-color:var(--accent2);border-width:4px}.opt.wrong{border-color:var(--wrong);border-width:4px}.msg{min-height:1.6em;font-weight:700;margin-top:10px;font-size:1.25rem}.msg.good{color:var(--accent2)}.msg.bad{color:var(--wrong)}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}td,th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center}.stat-row{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--border)}.emoji{font-size:2.4rem}
@media(max-width:420px){.card{padding:16px}.opt{font-size:1.65rem;padding:15px 4px}.topbar{font-size:1rem}.trail{gap:5px}.stop{min-height:36px}}
</style>

<script>
const WORD_GROUPS={

  home:{label:'הבית וחפצים',emoji:'🏠',words:['בַּיִת','חֶדֶר','דֶּלֶת','חַלּוֹן','שֻׁלְחָן','כִּסֵּא','מִטָּה','כּוֹס','צַלַּחַת','כַּף','מַזְלֵג','סַכִּין','מַפְתֵּחַ','מִטְרִיָּה','תִּיק גַּב']},
  nature:{label:'טבע ומזג האוויר',emoji:'🌈',words:['שֶׁמֶש','יָרֵחַ','כּוֹכָב','שָׁמַיִם','עָנָן','גֶּשֶׁם','שֶׁלֶג','רוּחַ','קַיִץ','חוֹרֶף','אָבִיב','סְתָיו','עֵץ','פֶּרַח','עָלֶה','דֶּשֶׁא','גַּן','יַעַר','הַר','יָם','נָהָר','חוֹל','אֶבֶן','גַּל','חוֹף','מַעְיָן','דֶּקֶל','שִׂיחַ','שֹׁרֶשׁ','עָנָף']},
  animals:{label:'בעלי חיים',emoji:'🐾',words:['כֶּלֶב','חָתוּל','סוּס','פָּרָה','כֶּבֶשׂ','תַּרְנְגוֹל','תַּרְנְגוֹלֶת','דָּג','צִפּוֹר','אַרְיֵה','דֹּב','פִּיל','קוֹף','נָחָש','עַכְבָּר','אַרְנָב','פַּרְפַּר','דְּבוֹרָה','חָתוּלָה','גּוּר','נָמֵר','זְאֵב','צָב','צְפַרְדֵּעַ','דּוֹלְפִין','בַּרְוָז','יוֹנָה']},
  food:{label:'אוכל ושתייה',emoji:'🍎',words:['לֶחֶם','חָלָב','בֵּיצָה','גְּבִינָה','תַּפּוּחַ','בָּנָנָה','תַּפּוּז','עֲנָבִים','אֲבַטִּיחַ','עוּגָה','גְּלִידָה','מַיִם','מִיץ','מָרָק','תַּפּוּד','גֶּזֶר','מְלָפְפוֹן','עַגְבָנִיָּה','תִּירָס','אֹרֶז','פִּיצָה','דְּבַשׁ','שׁוֹקוֹלָד','תָּמָר','תּוּת','לִימוֹן','בָּצָל']},
  body:{label:'הגוף',emoji:'🙂',words:['יָד','רֶגֶל','רֹאש','עַיִן','אֹזֶן','אַף','פֶּה','שֵׁן','שֵׂעָר','בֶּטֶן','גַּב','אֶצְבַּע']},
  colors:{label:'צבעים ותיאורים',emoji:'🎨',words:['אָדֹם','כָּחֹל','יָרֹק','צָהֹב','לָבָן','שָׁחוֹר','וָרֹד','כָּתֹם','סָגֹל','גָּדוֹל','קָטָן','גָּבוֹהַ','נָמוּך','חַם','קַר','יָפֶה','שָׂמֵחַ','עָצוּב','שָׁלֵו']},
  actions:{label:'פעולות ומספרים',emoji:'🏃',words:['אֶחָד','שְׁתַּיִם','שָׁלוֹש','אַרְבַּע','חָמֵש','שֵׁש','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','הוֹלֵך','רָץ','קוֹפֵץ','יוֹשֵׁב','יָשֵׁן','אוֹכֵל','שׁוֹתֶה','קוֹרֵא','כּוֹתֵב','מְשַׂחֵק','שָׁר','רוֹקֵד','צוֹחֵק','בּוֹכֶה','לָרוּץ','לָלֶכֶת','לִקְפֹּץ','לִר��קֹד','לָשִׁיר','לֶאֱכֹל','לִשְׁתּוֹת','לִכְתֹּב','לִצְחֹק','לִישֹׁן','לְשַׂחֵק','לְצַיֵּר','לִקְרֹא','לְסַדֵּר']},
  transport:{label:'תחבורה ובילוי',emoji:'🚗',words:['מְכוֹנִית','אוֹפַנַּיִם','רַכֶּבֶת','מָטוֹס','סְפִינָה','אוֹטוֹבּוּס','כַּדּוּר','צַעֲצוּעַ','בֻּבָּה','כֶּתֶר','כּוֹבַע','חוּלְצָה','מִכְנָסַיִם','שִׂמְלָה','נַעַל','גֶּרֶב','כֶּסֶף','מַתָּנָה','חַג','בֹּקֶר','עֶרֶב','לַיְלָה','הַיּוֹם','מָחָר','עַכְשָׁו']}
};
const AVATARS=[{id:'fox',emoji:'🦊',name:'שועל'},{id:'cat',emoji:'🐱',name:'חתול'},{id:'unicorn',emoji:'🦄',name:'חד-קרן'},{id:'robot',emoji:'🤖',name:'רובוט'},{id:'dino',emoji:'🦖',name:'דינוזאור'},{id:'rabbit',emoji:'🐰',name:'ארנב'}];
const PRAISE={boy:['אתה אלוף העולם! 🌟','כל הכבוד, אלוף! 🏆','איזה יופי, הצלחת! 🎉','אתה מצליח נהדר! 🚀','תשובה מצוינת! 👏','איזה מוח חריף יש לך! 🧠','אתה פשוט תותח! 💪','כל פעם אתה משתפר! ✨','איזה כיף, צדקת! 😄','המסלול מתקדם בזכותך! 🗺️'],girl:['את אלופת העולם! 🌟','כל הכבוד, אלופה! 🏆','איזה יופי, הצלחת! 🎉','את מצליחה נהדר! 🚀','תשובה מצוינת! 👏','איזה מוח חריף יש לך! 🧠','את פשוט תותחית! 💪','כל פעם את משתפרת! ✨','איזה כיף, צדקת! 😄','המסלול מתקדם בזכותך! 🗺️']};
const TRY_AGAIN={boy:['לא נורא, אתה מסוגל! נסה שוב 💛','כמעט! תקשיב שוב ונסה 😊','טעות עוזרת לנו ללמוד. נסה שוב! 🌱'],girl:['לא נורא, את מסוגלת! נסי שוב 💛','כמעט! הקשיבי שוב ונסי 😊','טעות עוזרת לנו ללמוד. נסי שוב! 🌱']};
const state={gender:'boy',avatar:AVATARS[0].id,categories:[]};
let stats={start:Date.now(),attempts:0,totalAns:0,totalCorrect:0,totalWrong:0,mistakeMap:{},logs:[]};
let st={};const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function startScreen(){
 app.innerHTML=`<h2>בוחרים איך יוצאים להרפתקה! 🗺️</h2><p>בחרו דמות, לשון פנייה ושלושה נושאי מילים.</p>
 <h3 class="group-title">מי יוצא/ת למסע?</h3><div class="choices">${AVATARS.map(a=>`<button type="button" class="choice avatar-choice ${state.avatar===a.id?'selected':''}" aria-pressed="${state.avatar===a.id}" onclick="setAvatar('${a.id}')" title="${a.name}">${a.emoji}<small>${a.name}</small></button>`).join('')}</div>
 <h3 class="group-title">איך לפנות אליך?</h3><div class="choices"><button type="button" class="choice ${state.gender==='boy'?'selected':''}" aria-pressed="${state.gender==='boy'}" onclick="setGender('boy')">👦 תלמיד</button><button type="button" class="choice ${state.gender==='girl'?'selected':''}" aria-pressed="${state.gender==='girl'}" onclick="setGender('girl')">👧 תלמידה</button></div>
 <h3 class="group-title">בחרו בדיוק 3 קבוצות מילים <span>(${state.categories.length}/3)</span></h3><div class="category-grid">${Object.entries(WORD_GROUPS).map(([key,g])=>`<button type="button" class="category ${state.categories.includes(key)?'selected':''}" aria-pressed="${state.categories.includes(key)}" onclick="toggleCategory('${key}')">${g.emoji} ${g.label}<small>${g.words.length} מילים</small></button>`).join('')}</div>
 <p class="hint" id="setupHint" aria-live="polite">בחרו שלוש קבוצות כדי להתחיל.</p><button class="big-btn" id="startBtn" onclick="newGame()" ${state.categories.length!==3?'disabled':''}>יוצאים לדרך! 🚀</button>`;
}
function setAvatar(id){state.avatar=id;startScreen();}
function setGender(gender){state.gender=gender;startScreen();}
function toggleCategory(key){if(state.categories.includes(key)){state.categories=state.categories.filter(x=>x!==key);}else if(state.categories.length<3){state.categories.push(key);}startScreen();}
function selectedWords(){return [...new Set(state.categories.flatMap(key=>WORD_GROUPS[key].words))];}
function newGame(){
 const words=selectedWords();if(state.categories.length!==3||words.length<15){startScreen();return;}
 stats.attempts++;st={pool:shuffle(words).slice(0,15),idx:0,mistakes:0,firstTry:0,curOptions:[],attemptStart:Date.now(),answeredThisQOK:true,locked:false,ended:false};renderQuestion();
}
function renderTrail(){const avatar=AVATARS.find(a=>a.id===state.avatar)||AVATARS[0];return `<div class="trail" role="img" aria-label="מסלול: ${st.idx} מתוך 15 צעדים הושלמו">${Array.from({length:15},(_,i)=>`<div class="stop ${i<st.idx?'done':''} ${i===st.idx?'here':''}" aria-label="תחנה ${i+1}${i===st.idx?', הדמות כאן':''}">${i===st.idx?avatar.emoji:i<st.idx?'⭐':String(i+1)}</div>`).join('')}</div>`;}
function renderQuestion(){
 const word=st.pool[st.idx];if(!word||st.ended)return;st.curOptions=shuffle([word,...shuffle(selectedWords().filter(w=>w!==word)).slice(0,3)]);st.answeredThisQOK=true;st.locked=false;
 const hearts='❤️'.repeat(Math.max(0,5-st.mistakes))+'🖤'.repeat(st.mistakes);const avatar=AVATARS.find(a=>a.id===state.avatar)||AVATARS[0];
 app.innerHTML=`<div class="topbar"><span>${avatar.emoji} שאלה ${st.idx+1} מתוך 15</span><span class="hearts" aria-label="נותרו ${5-st.mistakes} ניסיונות">${hearts}</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="${st.idx}"><div style="width:${(st.idx/15)*100}%"></div></div>${renderTrail()}<button type="button" class="word-btn" onclick="speakCurrent()" aria-label="השמעת המילה שוב">🔊</button><div class="options">${st.curOptions.map((o,i)=>`<button type="button" class="opt" data-index="${i}" onclick="choose(this)">${o}</button>`).join('')}</div><div class="msg" id="msg" aria-live="assertive"></div><div id="nextArea"></div>`;speak(word);
}
let hebrewVoice=null;
function loadVoices(){if(!('speechSynthesis'in window))return;const voices=window.speechSynthesis.getVoices();hebrewVoice=voices.find(v=>v.lang==='he-IL')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('he'))||null;}
if('speechSynthesis'in window){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
function speak(word){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='he-IL';u.rate=.7;if(hebrewVoice)u.voice=hebrewVoice;window.speechSynthesis.speak(u);}
function speakCurrent(){if(st.pool[st.idx])speak(st.pool[st.idx]);}
function choose(btn){if(st.locked||st.ended)return;const chosen=st.curOptions[Number(btn.dataset.index)],correctWord=st.pool[st.idx],msg=document.getElementById('msg');if(!msg)return;stats.totalAns++;
 if(chosen===correctWord){st.locked=true;stats.totalCorrect++;btn.classList.add('correct');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(st.answeredThisQOK)st.firstTry++;msg.className='msg good';msg.textContent=pick(PRAISE[state.gender]);st.idx++;const isLast=st.idx>=15;document.getElementById('nextArea').innerHTML=`<button type="button" class="big-btn" onclick="${isLast?'finishSuccess()':'renderQuestion()'}">${isLast?'לקו הסיום! 🏁':'ממשיכים במסלול ➡️'}</button>`;
 }else{stats.totalWrong++;stats.mistakeMap[correctWord]=(stats.mistakeMap[correctWord]||0)+1;st.answeredThisQOK=false;st.mistakes++;btn.classList.add('wrong');btn.disabled=true;document.querySelector('.hearts').textContent='❤️'.repeat(Math.max(0,5-st.mistakes))+'🖤'.repeat(st.mistakes);if(st.mistakes>=5){st.locked=true;st.ended=true;msg.className='msg bad';msg.textContent='המסע נעצר כאן, אבל אפשר לנסות שוב! 💪';stats.logs.push({completed:false,mistakes:st.mistakes,firstTry:st.firstTry,q:st.idx+1,dur:Date.now()-st.attemptStart});document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.getElementById('nextArea').innerHTML=`<button type="button" class="big-btn" onclick="newGame()">יוצאים למסע חדש 🔄</button>`;}else{msg.className='msg bad';msg.textContent=pick(TRY_AGAIN[state.gender]);}}
}
function finishSuccess(){if(st.ended)return;st.ended=true;stats.logs.push({completed:true,mistakes:st.mistakes,firstTry:st.firstTry,q:15,dur:Date.now()-st.attemptStart});renderReport();}
function fmtDur(ms){const s=Math.round(ms/1000);return s<60?s+' שנ׳':Math.floor(s/60)+' דק׳ '+(s%60)+' שנ׳';}
function renderReport(){const totalDur=Date.now()-stats.start,acc=stats.totalAns?Math.round(100*stats.totalCorrect/stats.totalAns):0,hardWords=Object.entries(stats.mistakeMap).sort((a,b)=>b[1]-a[1]).slice(0,8),rows=stats.logs.map((l,i)=>`<tr><td>${i+1}</td><td>${l.completed?'הושלם ✅':'הופסק ⏹'}</td><td>${l.q}</td><td>${l.mistakes}</td><td>${l.firstTry}</td><td>${fmtDur(l.dur)}</td></tr>`).join(''),avatar=AVATARS.find(a=>a.id===state.avatar)||AVATARS[0];app.innerHTML=`<div class="emoji">🏆</div><h2>הגעת לקו הסיום! ${avatar.emoji}</h2><p class="sub">איזה מסע נהדר עשית!</p><div class="stat-row"><span>זמן משחק כולל</span><b>${fmtDur(totalDur)}</b></div><div class="stat-row"><span>מספר ניסיונות</span><b>${stats.attempts}</b></div><div class="stat-row"><span>שאלות שנענו</span><b>${stats.totalAns}</b></div><div class="stat-row"><span>תשובות נכונות</span><b>${stats.totalCorrect}</b></div><div class="stat-row"><span>תשובות שגויות</span><b>${stats.totalWrong}</b></div><div class="stat-row"><span>אחוז הצלחה</span><b>${acc}%</b></div><div class="stat-row"><span>נכון בפעם הראשונה במסע האחרון</span><b>${st.firstTry}/15</b></div>${hardWords.length?`<p class="sub">מילים שכדאי לתרגל שוב:</p><table><tr><th>מילה</th><th>טעויות</th></tr>${hardWords.map(([w,c])=>`<tr><td>${w}</td><td>${c}</td></tr>`).join('')}</table>`:'<p>🎉 לא היו מילים שדרשו ניחוש נוסף!</p>'}<p class="sub">פירוט לפי מסע:</p><table><tr><th>#</th><th>סטטוס</th><th>שאלות</th><th>טעויות</th><th>נכון ראשון</th><th>משך</th></tr>${rows}</table><button type="button" class="big-btn" onclick="startScreen()">בוחרים מסלול חדש 🔄</button>`;}
startScreen();
</script>
</body>
</html>
