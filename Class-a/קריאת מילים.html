<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e8">
<title>משחק קריאה - כיתה א׳</title>
<style>
:root{color-scheme:light;--bg:#fff6e8;--card:#fff;--ink:#30243c;--muted:#6d6077;--accent:#ff8552;--accent-dark:#bf4c24;--green:#43aa8b;--green-dark:#176b53;--wrong:#e05263;--border:#f1d8b8;--shadow:rgba(66,39,22,.13)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#241f2e;--card:#332c40;--ink:#f5ecff;--muted:#c9bdd5;--border:#4a3f5c;--shadow:rgba(0,0,0,.4);--accent-dark:#ffb08d;--green-dark:#9ce3cc}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#241f2e;--card:#332c40;--ink:#f5ecff;--muted:#c9bdd5;--border:#4a3f5c;--shadow:rgba(0,0,0,.4);--accent-dark:#ffb08d;--green-dark:#9ce3cc}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 10%,rgba(255,209,102,.22),transparent 35%),radial-gradient(ellipse at 90% 30%,rgba(67,170,139,.12),transparent 35%),var(--bg);font-size:18px;line-height:1.55}.wrap{width:min(900px,100% - 28px);margin:0 auto;padding:24px 0 42px}h1{text-align:center;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.25;margin:8px 0 22px}.card{background:var(--card);border:2px solid var(--border);border-radius:26px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 32px var(--shadow)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid #6b8cff;outline-offset:3px}.welcome{text-align:center;background:linear-gradient(135deg,rgba(255,209,102,.2),rgba(67,170,139,.12));border:1px solid var(--border);border-radius:22px;padding:20px;margin-bottom:24px}.welcome-tag{font-size:.92rem;font-weight:800;color:var(--accent-dark)}.welcome h2{font-size:1.65rem;margin:5px 0}.welcome p{margin:4px auto;max-width:620px;color:var(--muted)}.setup-section{margin:22px 0}.group-title{font-size:1.2rem;margin:0 0 10px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.choice,.category{border:2px solid var(--border);background:var(--card);border-radius:16px;padding:10px 15px;min-height:54px;font-weight:700;transition:transform .15s,border-color .15s,background .15s}.choice:hover,.category:hover{transform:translateY(-2px);border-color:var(--accent)}.choice.selected,.category.selected{border-color:var(--green);background:rgba(67,170,139,.12);box-shadow:0 0 0 2px rgba(67,170,139,.12)}.avatar-choice{font-size:1.12rem}.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.category{text-align:right;font-size:1rem}.hint{min-height:1.6em;color:var(--green-dark);font-weight:700;text-align:center;margin:12px 0}.primary,.secondary,.sound-button{border:0;border-radius:16px;font-weight:800;transition:transform .15s,filter .15s}.primary{display:block;width:min(100%,360px);margin:16px auto 0;padding:14px 20px;background:var(--accent);color:#28180f;font-size:1.15rem;box-shadow:0 5px 0 rgba(148,68,31,.22)}.primary:hover,.secondary:hover,.sound-button:hover{filter:brightness(1.04);transform:translateY(-2px)}.primary:disabled{opacity:.48;cursor:not-allowed;transform:none}.secondary{padding:10px 16px;background:rgba(67,170,139,.16);border:1px solid var(--green);color:var(--green-dark)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-weight:800}.progress{height:13px;border-radius:20px;background:rgba(128,112,144,.18);overflow:hidden;margin:8px 0 20px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#43aa8b,#9bdc6b);border-radius:inherit;transition:width .35s}.question-box{text-align:center;border-radius:22px;background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(255,133,82,.08));padding:20px 14px;margin:12px 0 18px}.question-box p{margin:0 0 8px;color:var(--muted);font-weight:700}.word-line{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.sound-button{padding:10px 20px;min-height:58px;background:#fff0c7;border:2px solid #efc96a;font-size:1.15rem}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.opt{min-height:76px;padding:12px 8px;border:2px solid var(--border);border-radius:18px;background:var(--card);font-size:clamp(1.35rem,5vw,1.8rem);font-weight:800;box-shadow:0 3px 0 var(--shadow);transition:transform .15s,border-color .15s,background .15s}.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}.opt:disabled{cursor:default}.opt.correct{border-color:var(--green);background:rgba(67,170,139,.18)}.opt.incorrect{border-color:var(--wrong);background:rgba(224,82,99,.12)}.feedback{min-height:3.2em;margin:16px 0 4px;text-align:center;font-size:1.15rem;font-weight:800}.feedback.good{color:var(--green-dark)}.feedback.bad{color:var(--wrong)}.continue{display:block;margin:0 auto}.report{text-align:center}.report h2{font-size:1.8rem;margin:5px 0}.report-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0}.stat{padding:14px;background:rgba(67,170,139,.1);border:1px solid var(--border);border-radius:16px}.stat strong{display:block;font-size:1.65rem}.report-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.small-note{font-size:.9rem;color:var(--muted);text-align:center;margin:18px 0 0}
@media(max-width:520px){.wrap{width:calc(100% - 18px);padding-top:12px}.card{padding:16px;border-radius:20px}.welcome{padding:16px 10px}.options{gap:9px}.opt{min-height:68px}.topbar{font-size:.98rem}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.category{padding:9px 8px;font-size:.95rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap"><h1>🎈 משחק קריאה לכיתה א׳ 🎈</h1><main class="card" id="app" aria-live="polite"></main></div>
<script>
'use strict';
const WORD_GROUPS={
 family:{label:'משפחה וחברים',emoji:'👨‍👩‍👧',words:['אַבָּא','אִמָּא','יֶלֶד','יַלְדָּה','תִּינוֹק','סָבָא','סָבְתָא','אָח','אָחוֹת','דּוֹד','דּוֹדָה','חָבֵר','חֲבֵרָה','מִשְׁפָּחָה','תַּלְמִיד','תַּלְמִידָה']},
 school:{label:'בית הספר',emoji:'🎒',words:['סֵפֶר','עִפָּרוֹן','יַלְקוּט','תִּיק','מַחְבֶּרֶת','כִּתָּה','מוֹרָה','מוֹרֶה','לוּחַ','טוּשׁ','מַחְק','מְחַדֵּד','צֶבַע','דַּף','שִׁעוּר','תַּרְמִיל']},
 home:{label:'הבית וחפצים',emoji:'🏠',words:['בַּיִת','חֶדֶר','דֶּלֶת','חַלּוֹן','שֻׁלְחָן','כִּסֵּא','מִטָּה','כּוֹס','צַלַּחַת','סַפָּה','מְנוֹרָה','מְקָרֵר','תַּנּוּר','שָׁטִיחַ','מַפְתֵּחַ','מַרְאָה','אָרוֹן']},
 nature:{label:'טבע ומזג האוויר',emoji:'🌈',words:['שֶׁמֶשׁ','יָרֵחַ','כּוֹכָב','שָׁמַיִם','עָנָן','גֶּשֶׁם','שֶׁלֶג','רוּחַ','קַיִץ','חֹרֶף','אָבִיב','סְתָיו','פֶּרַח','עֵץ','עָלֶה','הַר','יָם','נָהָר']},
 animals:{label:'בעלי חיים',emoji:'🐾',words:['כֶּלֶב','חָתוּל','סוּס','פָּרָה','כֶּבֶשׂ','תַּרְנְגוֹל','תַּרְנְגוֹלֶת','דָּג','צִפּוֹר','אַרְנֶבֶת','צָב','פִּיל','קוֹף','דֹּב','נָחָשׁ','חֲמוֹר','גִּ׳ירָפָה']},
 food:{label:'אוכל ושתייה',emoji:'🍎',words:['לֶחֶם','חָלָב','בֵּיצָה','גְּבִינָה','תַּפּוּחַ','בָּנָנָה','תַּפּוּז','עֲנָבִים','מַיִם','מִיץ','עוּגָה','מָרָק','אֹרֶז','שׁוֹקוֹלָד','עֻגִיָּה','אֲפוּנָה','גֶּזֶר']},
 body:{label:'הגוף',emoji:'🙂',words:['יָד','רֶגֶל','רֹאשׁ','עַיִן','אֹזֶן','אַף','פֶּה','שֵׁן','שֵׂעָר','בֶּטֶן','גַּב','אֶצְבַּע','לֵב','בֶּרֶךְ','כָּתֵף','צַוָּאר']},
 colors:{label:'צבעים ותיאורים',emoji:'🎨',words:['אָדֹם','כָּחֹל','יָרֹק','צָהֹב','לָבָן','שָׁחוֹר','וָרֹד','כָּתֹם','סָגֹל','גָּדוֹל','קָטָן','יָפֶה','יָפָה','חָדָשׁ','טוֹב','מָתוֹק']},
 actions:{label:'פעולות ומספרים',emoji:'🏃',words:['אֶחָד','שְׁנַיִם','שְׁלֹשָׁה','אַרְבָּעָה','חֲמִשָּׁה','שִׁשָּׁה','שִׁבְעָה','שְׁמוֹנָה','תִּשְׁעָה','עֲשָׂרָה','רָץ','קָפַץ','שָׁר','רָקַד','אוֹכֵל','שׁוֹתֶה','לוֹמֵד','קוֹרֵא','מְשַׂחֵק']},
 transport:{label:'תחבורה ובילוי',emoji:'🚗',words:['מְכוֹנִית','אוֹפַנַּיִם','רַכֶּבֶת','מָטוֹס','סְפִינָה','אוֹטוֹבּוּס','כַּדּוּר','גַּנְדֶּרֶת','מִגְרָשׁ','מִשְׂחָק','גִּנָּה','פַּארְק','טִיּוּל','מַפָּה','רְחוֹב','רַמְזוֹר','קַסְדָּה']}
};
const AVATARS=[{id:'fox',emoji:'🦊',name:'שועל'},{id:'cat',emoji:'🐱',name:'חתול'},{id:'unicorn',emoji:'🦄',name:'חד-קרן'},{id:'robot',emoji:'🤖',name:'רובוט'},{id:'dino',emoji:'🦖',name:'דינוזאור'}];
const PRAISE={boy:['אתה אלוף העולם! 🌟','כל הכבוד, אלוף! 🏆','איזה יופי, הצלחת! 🎉','אתה מצליח נהדר! 🚀','תשובה מצוינת! 👏','איזה מוח מבריק! 💡'],girl:['את אלופת העולם! 🌟','כל הכבוד, אלופה! 🏆','איזה יופי, הצלחת! 🎉','את מצליחה נהדר! 🚀','תשובה מצוינת! 👏','איזה מוח מבריק! 💡']};
const TRY_AGAIN={boy:['לא נורא, אתה מסוגל! נסה שוב 💛','כמעט! תקשיב שוב ונסה 😊','טעות עוזרת לנו ללמוד. נסה שוב! 🌱'],girl:['לא נורא, את מסוגלת! נסי שוב 💛','כמעט! תקשיבי שוב ונסי 😊','טעות עוזרת לנו ללמוד. נסי שוב! 🌱']};
const state={gender:'boy',avatar:AVATARS[0].id,categories:[]};
const app=document.getElementById('app');
let game={};
let audioContext=null;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function pick(items){return items[Math.floor(Math.random()*items.length)]}
function selectedWords(){return [...new Set(state.categories.flatMap(key=>WORD_GROUPS[key].words))]}
function startScreen(){
 app.innerHTML=`<section class="welcome"><span class="welcome-tag">🌟 הרפתקת קריאה 🌟</span><h2>מוכנים למסע של מילים?</h2><p>הקשיבו למילה, בחרו את התשובה הנכונה, וצעדו בדרך להצלחה!</p></section>
 <section class="setup-section"><h3 class="group-title">מי יוצא/ת למסע?</h3><div class="choices">${AVATARS.map(a=>`<button type="button" class="choice avatar-choice ${state.avatar===a.id?'selected':''}" aria-pressed="${state.avatar===a.id}" onclick="setAvatar('${a.id}')">${a.emoji} ${a.name}</button>`).join('')}</div></section>
 <section class="setup-section"><h3 class="group-title">איך לפנות אליך?</h3><div class="choices"><button type="button" class="choice ${state.gender==='boy'?'selected':''}" aria-pressed="${state.gender==='boy'}" onclick="setGender('boy')">בן 👦</button><button type="button" class="choice ${state.gender==='girl'?'selected':''}" aria-pressed="${state.gender==='girl'}" onclick="setGender('girl')">בת 👧</button></div></section>
 <section class="setup-section"><h3 class="group-title">בחרו בדיוק 3 קבוצות מילים (${state.categories.length}/3)</h3><div class="category-grid">${Object.entries(WORD_GROUPS).map(([key,group])=>`<button type="button" class="category ${state.categories.includes(key)?'selected':''}" aria-pressed="${state.categories.includes(key)}" onclick="toggleCategory('${key}')">${group.emoji} ${group.label}</button>`).join('')}</div><p class="hint" aria-live="polite">${state.categories.length===3?'נהדר! בחרתם שלוש קבוצות. המסע מחכה לכם!':'בחרו עוד '+(3-state.categories.length)+' קבוצות מילים'}</p><button class="primary" type="button" onclick="newGame()" ${state.categories.length!==3?'disabled':''}>🚀 מתחילים לשחק!</button></section>`;
}
function setAvatar(id){if(AVATARS.some(a=>a.id===id)){state.avatar=id;startScreen()}}
function setGender(gender){if(gender==='boy'||gender==='girl'){state.gender=gender;startScreen()}}
function toggleCategory(key){if(!Object.hasOwn(WORD_GROUPS,key))return;if(state.categories.includes(key)){state.categories=state.categories.filter(item=>item!==key)}else if(state.categories.length<3){state.categories.push(key)}startScreen()}
function unlockAudio(){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return null;try{audioContext=audioContext||new AudioContextClass();if(audioContext.state==='suspended')audioContext.resume();return audioContext}catch(_error){return null}}
function playSuccessSound(){const context=unlockAudio();if(!context)return;const now=context.currentTime;[[659.25,0],[783.99,.13],[1046.5,.26]].forEach(([frequency,offset])=>{const oscillator=context.createOscillator(),gain=context.createGain();oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,now+offset);gain.gain.setValueAtTime(.0001,now+offset);gain.gain.exponentialRampToValueAtTime(.16,now+offset+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.18);oscillator.connect(gain);gain.connect(context.destination);oscillator.start(now+offset);oscillator.stop(now+offset+.2)})}
function playTryAgainSound(){const context=unlockAudio();if(!context)return;const now=context.currentTime,oscillator=context.createOscillator(),gain=context.createGain();oscillator.type='triangle';oscillator.frequency.setValueAtTime(330,now);oscillator.frequency.exponentialRampToValueAtTime(250,now+.16);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.07,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+.2);oscillator.connect(gain);gain.connect(context.destination);oscillator.start(now);oscillator.stop(now+.21)}
function speak(text){if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return false;try{window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='he-IL';utterance.rate=.78;const voices=window.speechSynthesis.getVoices();const voice=voices.find(item=>item.lang.toLowerCase()==='he-il')||voices.find(item=>item.lang.toLowerCase().startsWith('he'));if(voice)utterance.voice=voice;window.speechSynthesis.speak(utterance);return true}catch(_error){return false}}
function newGame(){const words=selectedWords();if(state.categories.length!==3||words.length<4)return;game={pool:shuffle(words).slice(0,15),index:0,correct:0,mistakes:0,firstTry:0,locked:false,questionMistakes:0};renderQuestion();speak(game.pool[0])}
function renderQuestion(){if(game.index>=game.pool.length){renderReport();return}game.locked=false;game.questionMistakes=0;const word=game.pool[game.index];game.options=shuffle([word,...shuffle(selectedWords().filter(item=>item!==word)).slice(0,3)]);const avatar=AVATARS.find(item=>item.id===state.avatar)||AVATARS[0];app.innerHTML=`<div class="topbar"><span>${avatar.emoji} המסע שלך: ${game.index}/${game.pool.length}</span><button class="secondary" type="button" onclick="backToSetup()">↩ חזרה לבחירה</button></div><div class="progress" role="progressbar" aria-label="התקדמות" aria-valuemin="0" aria-valuemax="${game.pool.length}" aria-valuenow="${game.index}"><span style="width:${game.index/game.pool.length*100}%"></span></div><div class="question-box"><p>הקשיבו למילה ובחרו אותה:</p><button class="sound-button" type="button" aria-label="השמעת המילה שוב" onclick="speak(game.pool[game.index])">🔊 השמיעו את המילה שוב</button></div><div class="options" role="group" aria-label="אפשרויות תשובה">${game.options.map((option,index)=>`<button type="button" class="opt" data-index="${index}" onclick="choose(this)">${option}</button>`).join('')}</div><p id="msg" class="feedback" aria-live="assertive"></p><button id="continue" class="primary continue" type="button" hidden onclick="nextQuestion()">ממשיכים ➜</button><p class="small-note">אפשר ללחוץ על הרמקול כדי לשמוע שוב.</p>`}
function choose(button){if(game.locked)return;const chosen=game.options[Number(button.dataset.index)],correctWord=game.pool[game.index],message=document.getElementById('msg');if(!message)return;if(chosen===correctWord){game.locked=true;game.correct++;if(game.questionMistakes===0)game.firstTry++;document.querySelectorAll('.opt').forEach(option=>{option.disabled=true;if(option.textContent===correctWord)option.classList.add('correct')});message.textContent=pick(PRAISE[state.gender]);message.className='feedback good';if(Math.random()<.5)playSuccessSound();else if(!speak(message.textContent))playSuccessSound();document.getElementById('continue').hidden=false}else{game.questionMistakes++;game.mistakes++;button.classList.add('incorrect');button.disabled=true;message.textContent=pick(TRY_AGAIN[state.gender]);message.className='feedback bad';playTryAgainSound()}}
function nextQuestion(){if(!game.locked)return;game.index++;if(game.index>=game.pool.length){renderReport();return}renderQuestion();speak(game.pool[game.index])}
function backToSetup(){if('speechSynthesis'in window)window.speechSynthesis.cancel();startScreen()}
function renderReport(){const avatar=AVATARS.find(item=>item.id===state.avatar)||AVATARS[0];const percent=Math.round(game.correct/game.pool.length*100);app.innerHTML=`<section class="report"><div class="welcome"><span class="welcome-tag">${avatar.emoji} סיימתם את המסע!</span><h2>איזו עבודה נהדרת! 🎉</h2><p>${percent===100?'עניתם נכון על כל המילים!':'כל מילה שלמדתם היא הצלחה!'}</p></div><div class="report-stats"><div class="stat"><strong>${game.correct}/${game.pool.length}</strong>תשובות נכונות</div><div class="stat"><strong>${game.firstTry}</strong>תשובות נכונות בניסיון ראשון</div><div class="stat"><strong>${game.mistakes}</strong>ניסיונות נוספים</div></div><div class="report-actions"><button class="primary" type="button" onclick="newGame()">🔁 משחקים שוב</button><button class="secondary" type="button" onclick="backToSetup()">בחירת קבוצות אחרות</button></div></section>`;if(Math.random()<.5)playSuccessSound();else speak(pick(PRAISE[state.gender]))}
startScreen();
</script>
</body>
</html>
