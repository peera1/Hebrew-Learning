<style>

*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse at 10% 10%,rgba(255,209,102,.22),transparent 35%),radial-gradient(ellipse at 90% 90%,rgba(67,170,139,.14),transparent 35%),var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}.wrap{width:100%;max-width:720px}h1{text-align:center;font-size:1.55rem;margin:.2em 0 .65em;letter-spacing:.02em}.card{background:var(--card);border-radius:26px;box-shadow:0 12px 36px var(--shadow);padding:24px;text-align:center;border:1px solid color-mix(in srgb,var(--border) 65%,transparent)}.sub{color:var(--accent);font-weight:700}button{font-family:inherit;cursor:pointer;border:none;color:inherit}button:focus-visible{outline:3px solid #2878c8;outline-offset:3px}.big-btn{background:linear-gradient(135deg,#ff8552,#f35f70);color:#fff;font-size:1.15rem;font-weight:800;padding:14px 28px;border-radius:16px;margin-top:12px;box-shadow:0 6px 14px rgba(243,95,112,.25);transition:transform .18s,filter .18s}.big-btn:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-2px)}.big-btn:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}.group-title{margin:18px 0 8px}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.choice,.category{background:var(--bg);border:2px solid var(--border);border-radius:15px;padding:10px 14px;font-size:1.05rem;font-weight:700;transition:transform .18s,border-color .18s,background .18s}.choice:hover,.category:hover{transform:translateY(-2px)}.choice.selected,.category.selected{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,var(--card));box-shadow:0 3px 12px color-mix(in srgb,var(--accent2) 18%,transparent)}.avatar-choice{font-size:2rem;min-width:76px}.avatar-choice small{display:block;font-size:.8rem}.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.category small{display:block;font-size:.8rem;font-weight:400;margin-top:3px}.hint{min-height:1.5em;color:var(--wrong);font-weight:700}.welcome{position:relative;overflow:hidden;border-radius:22px;padding:22px 18px 20px;margin:-5px -5px 16px;background:linear-gradient(130deg,#fff1d2 0%,#ffe4d5 46%,#e0f5e9 100%);color:#382946}.welcome:before,.welcome:after{content:'✦';position:absolute;color:rgba(255,133,82,.48);font-size:1.4rem;animation:twinkle 2.4s ease-in-out infinite}.welcome:before{top:18px;right:9%}.welcome:after{bottom:18px;left:12%;animation-delay:.9s}.welcome h2{margin:5px 0 7px;font-size:1.65rem}.welcome p{margin:0}.welcome-icon{font-size:3rem;display:inline-block;filter:drop-shadow(0 5px 4px rgba(0,0,0,.12));animation:welcomeFloat 2.4s ease-in-out infinite}.welcome-tag{display:inline-block;background:rgba(255,255,255,.7);border-radius:20px;padding:5px 12px;font-size:.88rem;font-weight:800;color:#9c5634}.setup-section{padding:10px 0;border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:1.1rem;font-weight:700}.hearts{letter-spacing:2px;font-size:1.2rem}.progress{height:11px;background:var(--border);border-radius:6px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#43aa8b,#74c69d);transition:width .5s}.trail-wrap{margin:12px auto 18px;max-width:560px}.trail-caption{font-size:.92rem;font-weight:700;margin-bottom:8px}.trail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:9px;border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent2) 12%,var(--card)),color-mix(in srgb,var(--accent) 10%,var(--card)));border:1px solid var(--border)}.stop{min-height:46px;border-radius:15px;background:var(--card);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.05rem;position:relative;transition:background .3s,border-color .3s,transform .25s,box-shadow .25s}.stop.done{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 18%,var(--card));color:#258266}.stop.here{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 23%,transparent),0 5px 12px var(--shadow);z-index:1}.stop-avatar{font-size:1.8rem;display:inline-block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));animation:avatarBounce .65s ease-in-out infinite alternate}.word-btn{font-size:2.5rem;border-radius:50%;background:linear-gradient(145deg,#43aa8b,#319b83);color:#fff;width:88px;height:88px;box-shadow:0 5px 12px var(--shadow);margin:0 0 14px;transition:transform .2s}.word-btn:hover{transform:scale(1.06)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{background:var(--bg);border:3px solid var(--border);border-radius:16px;padding:18px 6px;font-size:2rem;font-weight:700;color:var(--ink);transition:transform .15s,border-color .15s}.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent2)}.opt:disabled{cursor:default}.opt.correct{border-color:var(--accent2);border-width:4px;background:color-mix(in srgb,var(--accent2) 12%,var(--card))}.opt.wrong{border-color:var(--wrong);border-width:4px;background:color-mix(in srgb,var(--wrong) 10%,var(--card))}.msg{min-height:1.6em;font-weight:700;margin-top:10px;font-size:1.25rem}.msg.good{color:var(--accent2)}.msg.bad{color:var(--wrong)}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}td,th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center}.stat-row{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--border)}.emoji{font-size:2.4rem}
@keyframes welcomeFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}@keyframes avatarBounce{from{transform:translateY(2px) rotate(-5deg)}to{transform:translateY(-5px) rotate(5deg)}}@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:480px){.card{padding:16px}.welcome{padding:18px 12px}.welcome h2{font-size:1.4rem}.opt{font-size:1.65rem;padding:15px 4px}.topbar{font-size:1rem}.trail{gap:5px;padding:6px}.stop{min-height:38px;border-radius:12px}}

<script>
const WORD_GROUPS={
 family:{label:'משפחה וחברים',emoji:'👨‍👩‍👧',words:['אַבָּא','אִמָא','יֶלֶד','יַלְדָּה','תִּינוֹק','סָבָא','סָבְתָא','אָח','אָחוֹת','מִשְׁפָּחָה','תַּלְמִיד','תַּלְמִידָה','חָבֵר','חֲבֵרָה','חֲבֵרִים','אַהֲבָה']},

 home:{label:'הבית וחפצים',emoji:'🏠',words:['בַּיִת','חֶדֶר','דֶּלֶת','חַלּוֹן','שֻׁלְחָן','כִּסֵּא','מִטָּה','כּוֹס','צַלַּחַת','כַּף','מַזְלֵג','סַכִּין','מַפְתֵּחַ','מִטְרִיָּה','תִּיק גַּב']},
 nature:{label:'טבע ומזג האוויר',emoji:'🌈',words:['שֶׁמֶש','יָרֵחַ','כּוֹכָב','שָׁמַיִם','עָנָן','גֶּשֶׁם','שֶׁלֶג','רוּחַ','קַיִץ','חוֹרֶף','אָבִיב','סְתָיו','עֵץ','פֶּרַח','עָלֶה','דֶּשֶׁא','גַּן','יַעַר','הַר','יָם','נָהָר','חוֹל','אֶבֶן','גַּל','חוֹף','מַעְיָן','דֶּקֶל','שִׂיחַ','שֹׁרֶשׁ','עָנָף']},
 animals:{label:'בעלי חיים',emoji:'🐾',words:['כֶּלֶב','חָתוּל','סוּס','פָּרָה','כֶּבֶשׂ','תַּרְנְגוֹל','תַּרְנְגוֹלֶת','דָּג','צִפּוֹר','אַרְיֵה','דֹּב','פִּיל','קוֹף','נָחָש','עַכְבָּר','אַרְנָב','פַּרְפַּר','דְּבוֹרָה','חָתוּלָה','גּוּר','נָמֵר','זְאֵב','צָב','צְפַרְדֵּעַ','דּוֹלְפִין','בַּרְוָז','יוֹנָה']},
 food:{label:'אוכל ושתייה',emoji:'🍎',words:['לֶחֶם','חָלָב','בֵּיצָה','גְּבִינָה','תַּפּוּחַ','בָּנָנָה','תַּפּוּז','עֲנָבִים','אֲבַטִּיחַ','עוּגָה','גְּלִידָה','מַיִם','מִיץ','מָרָק','תַּפּוּד','גֶּזֶר','מְלָפְפוֹן','עַגְבָנִיָּה','תִּירָס','אֹרֶז','פִּיצָה','דְּבַשׁ','שׁוֹקוֹלָד','תָּמָר','תּוּת','לִימוֹן','בָּצָל']},
 body:{label:'הגוף',emoji:'🙂',words:['יָד','רֶגֶל','רֹאש','עַיִן','אֹזֶן','אַף','פֶּה','שֵׁן','שֵׂעָר','בֶּטֶן','גַּב','אֶצְבַּע']},
 colors:{label:'צבעים ותיאורים',emoji:'🎨',words:['אָדֹם','כָּחֹל','יָרֹק','צָהֹב','לָבָן','שָׁחוֹר','וָרֹד','כָּתֹם','סָגֹל','גָּדוֹל','קָטָן','גָּבוֹהַ','נָמוּך','חַם','קַר','יָפֶה','שָׂמֵחַ','עָצוּב','שָׁלֵו']},
 actions:{label:'פעולות ומספרים',emoji:'🏃',words:['אֶחָד','שְׁתַּיִם','שָׁלוֹש','אַרְבַּע','חָמֵש','שֵׁש','שֶׁבַע','שְׁמוֹנֶה','תֵּשַׁע','עֶשֶׂר','הוֹלֵך','רָץ','קוֹפֵץ','יוֹשֵׁב','יָשֵׁן','אוֹכֵל','שׁוֹתֶה','קוֹרֵא','כּוֹתֵב','מְשַׂחֵק','שָׁר','רוֹקֵד','צוֹחֵק','בּוֹכֶה','לָרוּץ','לָלֶכֶת','לִקְפֹּץ','לִרְקֹד','לָשִׁיר','לֶאֱכֹל','לִשְׁתּוֹת','לִכְתֹּב','לִצְחֹק','לִישֹׁן','לְשַׂחֵק','לְצַיֵּר','לִקְרֹא','לְסַדֵּר']},
 transport:{label:'תחבורה ובילוי',emoji:'🚗',words:['מְכוֹנִית','אוֹפַנַּיִם','רַכֶּבֶת','מָטוֹס','סְפִינָה','אוֹטוֹבּוּס','כַּדּוּר','צַעֲצוּעַ','בֻּבָּה','כֶּתֶר','כּוֹבַע','חוּלְצָה','מִכְנָסַיִם','שִׂמְלָה','נַעַל','גֶּרֶב','כֶּסֶף','מַתָּנָה','חַג','בֹּקֶר','עֶרֶב','לַיְלָה','הַיּוֹם','מָחָר','עַכְשָׁו']}
};
const AVATARS=[{id:'fox',emoji:'🦊',name:'שועל'},{id:'cat',emoji:'🐱',name:'חתול'},{id:'unicorn',emoji:'🦄',name:'חד-קרן'},{id:'robot',emoji:'🤖',name:'רובוט'},{id:'dino',emoji:'🦖',name:'דינוזאור'},{id:'rabbit',emoji:'🐰',name:'ארנב'}];
const PRAISE={boy:['אתה אלוף העולם! 🌟','כל הכבוד, אלוף! 🏆','איזה יופי, הצלחת! 🎉','אתה מצליח נהדר! 🚀','תשובה מצוינת! 👏','איזה מוח חריף יש לך! 🧠','אתה פשוט תותח! 💪','כל פעם אתה משתפר! ✨','איזה כיף, צדקת! 😄','המסלול מתקדם בזכותך! 🗺️'],girl:['את אלופת העולם! 🌟','כל הכבוד, אלופה! 🏆','איזה יופי, הצלחת! 🎉','את מצליחה נהדר! 🚀','תשובה מצוינת! 👏','איזה מוח חריף יש לך! 🧠','את פשוט תותחית! 💪','כל פעם את משתפרת! ✨','איזה כיף, צדקת! 😄','המסלול מתקדם בזכותך! 🗺️']};
const TRY_AGAIN={boy:['לא נורא, אתה מסוגל! נסה שוב 💛','כמעט! תקשיב שוב ונסה 😊','טעות עוזרת לנו ללמוד. נסה שוב! 🌱'],girl:['לא נורא, את מסוגלת! נסי שוב 💛','כמעט! הקשיבי שוב ונסי 😊','טעות עוזרת לנו ללמוד. נסי שוב! 🌱']};
const state={gender:'boy',avatar:AVATARS[0].id,categories:[]};let stats={start:Date.now(),attempts:0,totalAns:0,totalCorrect:0,totalWrong:0,mistakeMap:{},logs:[]};let st={};const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function startScreen(){app.innerHTML=`<section class="welcome"><span class="welcome-tag">🌟 הרפתקת קריאה 🌟</span><br><span class="welcome-icon" aria-hidden="true">${(AVATARS.find(a=>a.id===state.avatar)||AVATARS[0]).emoji}</span><h2>מוכנים למסע של מילים?</h2><p>בוחרים חבר למסע, אוספים כוכבים וצועדים עד לקו הסיום!</p></section><p>בוחרים דמות, לשון פנייה ושלושה נושאי מילים.</p>
<div class="setup-section"><h3 class="group-title">מי יוצא/ת למסע?</h3><div class="choices">${AVATARS.map(a=>`<button type="button" class="choice avatar-choice ${state.avatar===a.id?'selected':''}" aria-pressed="${state.avatar===a.id}" onclick="setAvatar('${a.id}')">${a.emoji}<small>${a.name}</small></button>`).join('')}</div></div>
<div class="setup-section"><h3 class="group-title">איך לפנות אליך?</h3><div class="choices"><button type="button" class="choice ${state.gender==='boy'?'selected':''}" aria-pressed="${state.gender==='boy'}" onclick="setGender('boy')">👦 תלמיד</button><button type="button" class="choice ${state.gender==='girl'?'selected':''}" aria-pressed="${state.gender==='girl'}" onclick="setGender('girl')">👧 תלמידה</button></div></div>
<div class="setup-section"><h3 class="group-title">בחרו בדיוק 3 קבוצות מילים (${state.categories.length}/3)</h3><div class="category-grid">${Object.entries(WORD_GROUPS).map(([key,g])=>`<button type="button" class="category ${state.categories.includes(key)?'selected':''}" aria-pressed="${state.categories.includes(key)}" onclick="toggleCategory('${key}')">${g.emoji} ${g.label}<small>${g.words.length} מילים</small></button>`).join('')}</div></div>
<p class="hint" aria-live="polite">${state.categories.length===3?'נהדר! בחרתם שלוש קבוצות. המסע מחכה לכם!':'בחרו עוד '+(3-state.categories.length)+' קבוצות כדי להתחיל.'}</p><button type="button" class="big-btn" onclick="newGame()" ${state.categories.length!==3?'disabled':''}>יוצאים לדרך! 🚀</button>`}
function setAvatar(id){state.avatar=id;startScreen()}function setGender(gender){state.gender=gender;startScreen()}function toggleCategory(key){if(state.categories.includes(key))state.categories=state.categories.filter(x=>x!==key);else if(state.categories.length<3)state.categories.push(key);startScreen()}
function selectedWords(){return [...new Set(state.categories.flatMap(key=>WORD_GROUPS[key].words))]}
function newGame(){const words=selectedWords();if(state.categories.length!==3||words.length<15)return;stats.attempts++;st={pool:shuffle(words).slice(0,15),idx:0,mistakes:0,firstTry:0,curOptions:[],attemptStart:Date.now(),answeredThisQOK:true,locked:false,ended:false};renderQuestion()}
function trailMarkup(){const avatar=AVATARS.find(a=>a.id===state.avatar)||AVATARS[0];return `<div class="trail-wrap"><div class="trail-caption">${avatar.emoji} המסע שלך: ${Math.min(st.idx,15)} מתוך 15 צעדים</div><div class="trail" role="img" aria-label="מסלול: ${Math.min(st.idx,15)} מתוך 15 צעדים הושלמו">${Array.from({length:15},(_,i)=>`<div class="stop ${i<st.idx?'done':''} ${i===st.idx&&st.idx<15?'here':''}" data-stop="${i}" aria-label="תחנה ${i+1}${i===st.idx?', הדמות כאן':''}">${i===st.idx&&st.idx<15?`<span class="stop-avatar">${avatar.emoji}</span>`:i<st.idx?'⭐':String(i+1)}</div>`).join('')}</div></div>`}
function renderQuestion(){const word=st.pool[st.idx];if(!word||st.ended)return;st.curOptions=shuffle([word,...shuffle(selectedWords().filter(w=>w!==word)).slice(0,3)]);st.answeredThisQOK=true;st.locked=false;const hearts='❤️'.repeat(Math.max(0,5-st.mistakes))+'🖤'.repeat(st.mistakes);const avatar=AVATARS.find(a=>a.id===state.avatar)||AVATARS[0];app.innerHTML=`<div class="topbar"><span>${avatar.emoji} שאלה ${st.idx+1} מתוך 15</span><span class="hearts" aria-label="נותרו ${5-st.mistakes} ניסיונות">${hearts}</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="${st.idx}"><div style="width:${(st.idx/15)*100}%"></div></div>${trailMarkup()}<button type="button" class="word-btn" onclick="speakCurrent()" aria-label="השמעת המילה שוב">🔊</button><div class="options">${st.curOptions.map((o,i)=>`<button type="button" class="opt" data-index="${i}" onclick="choose(this)">${o}</button>`).join('')}</div><div class="msg" id="msg" aria-live="assertive"></div><div id="nextArea"></div>`;speak(word)}
function animateTrail(){const oldAvatar=document.querySelector('.stop-avatar');const oldRect=oldAvatar?.getBoundingClientRect();const wrap=document.querySelector('.trail-wrap');if(!wrap)return;wrap.outerHTML=trailMarkup();const newAvatar=document.querySelector('.stop-avatar');if(!oldRect||!newAvatar||!newAvatar.animate||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const newRect=newAvatar.getBoundingClientRect();newAvatar.animate([{transform:`translate(${oldRect.left-newRect.left}px,${oldRect.top-newRect.top}px) scale(1.2)`},{transform:'translate(0,0) scale(1)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})}
let hebrewVoice=null;function loadVoices(){if(!('speechSynthesis'in window))return;const voices=window.speechSynthesis.getVoices();hebrewVoice=voices.find(v=>v.lang==='he-IL')||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('he'))||null}if('speechSynthesis'in window){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
function speak(word){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='he-IL';u.rate=.7;if(hebrewVoice)u.voice=hebrewVoice;window.speechSynthesis.speak(u)}function speakCurrent(){if(st.pool[st.idx])speak(st.pool[st.idx])}
function choose(btn){if(st.locked||st.ended)return;const chosen=st.curOptions[Number(btn.dataset.index)],correctWord=st.pool[st.idx],msg=document.getElementById('msg');if(!msg)return;stats.totalAns++;if(chosen===correctWord){st.locked=true;stats.totalCorrect++;btn.classList.add('correct');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(st.answeredThisQOK)st.firstTry++;msg.className='msg good';msg.textContent=pick(PRAISE[state.gender]);st.idx++;animateTrail();const isLast=st.idx>=15;document.getElementById('nextArea').innerHTML=`<button type="button" class="big-btn" onclick="${isLast?'finishSuccess()':'renderQuestion()'}">${isLast?'לקו הסיום! 🏁':'ממשיכים במסלול ➡️'}</button>`}else{stats.totalWrong++;stats.mistakeMap[correctWord]=(stats.mistakeMap[correctWord]||0)+1;st.answeredThisQOK=false;st.mistakes++;btn.classList.add('wrong');btn.disabled=true;const heartEl=document.querySelector('.hearts');if(heartEl)heartEl.textContent='❤️'.repeat(Math.max(0,5-st.mistakes))+'🖤'.repeat(st.mistakes);if(st.mistakes>=5){st.locked=true;st.ended=true;msg.className='msg bad';msg.textContent='המסע נעצר כאן, אבל אפשר לנסות שוב! 💪';stats.logs.push({completed:false,mistakes:st.mistakes,firstTry:st.firstTry,q:st.idx+1,dur:Date.now()-st.attemptStart});document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.getElementById('nextArea').innerHTML='<button type="button" class="big-btn" onclick="newGame()">יוצאים למסע חדש 🔄</button>'}else{msg.className='msg bad';msg.textContent=pick(TRY_AGAIN[state.gender])}}}
function finishSuccess(){if(st.ended)return;st.ended=true;stats.logs.push({completed:true,mistakes:st.mistakes,firstTry:st.firstTry,q:15,dur:Date.now()-st.attemptStart});renderReport()}
function fmtDur(ms){const s=Math.round(ms/1000);return s<60?s+' שנ׳':Math.floor(s/60)+' דק׳ '+(s%60)+' שנ׳'}
function renderReport(){const totalDur=Date.now()-stats.start,acc=stats.totalAns?Math.round(100*stats.totalCorrect/stats.totalAns):0,hardWords=Object.entries(stats.mistakeMap).sort((a,b)=>b[1]-a[1]).slice(0,8),rows=stats.logs.map((l,i)=>`<tr><td>${i+1}</td><td>${l.completed?'הושלם ✅':'הופסק ⏹'}</td><td>${l.q}</td><td>${l.mistakes}</td><td>${l.firstTry}</td><td>${fmtDur(l.dur)}</td></tr>`).join(''),avatar=AVATARS.find(a=>a.id===state.avatar)||AVATARS[0];app.innerHTML=`<div class="emoji">🏆</div><h2>הגעת לקו הסיום! ${avatar.emoji}</h2><p class="sub">איזה מסע נהדר עשית!</p><div class="stat-row"><span>זמן משחק כולל</span><b>${fmtDur(totalDur)}</b></div><div class="stat-row"><span>מספר ניסיונות</span><b>${stats.attempts}</b></div><div class="stat-row"><span>שאלות שנענו</span><b>${stats.totalAns}</b></div><div class="stat-row"><span>תשובות נכונות</span><b>${stats.totalCorrect}</b></div><div class="stat-row"><span>תשובות שגויות</span><b>${stats.totalWrong}</b></div><div class="stat-row"><span>אחוז הצלחה</span><b>${acc}%</b></div><div class="stat-row"><span>נכון בפעם הראשונה במסע האחרון</span><b>${st.firstTry}/15</b></div>${hardWords.length?`<p class="sub">מילים שכדאי לתרגל שוב:</p><table><tr><th>מילה</th><th>טעויות</th></tr>${hardWords.map(([w,c])=>`<tr><td>${w}</td><td>${c}</td></tr>`).join('')}</table>`:'<p>🎉 לא היו מילים שדרשו ניחוש נוסף!</p>'}<p class="sub">פירוט לפי מסע:</p><table><tr><th>#</th><th>סטטוס</th><th>שאלות</th><th>טעויות</th><th>נכון ראשון</th><th>משך</th></tr>${rows}</table><button type="button" class="big-btn" onclick="startScreen()">בוחרים מסלול חדש 🔄</button>`}
startScreen();
</script>
</body>
</html>
