<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>טוען את ספר הקריאה...</title>
</head>
<body>
  <p>טוען את ספר הקריאה...</p>
  <script>
    const sourceUrl = 'https://raw.githubusercontent.com/peera1/Hebrew-Learning/9c98453b6f5841b30cec69db6c5f38eb74744466/Class-a/%D7%A7%D7%A8%D7%99%D7%90%D7%AA%20%D7%9E%D7%A9%D7%A4%D7%98%D7%99%D7%9D%20%D7%94%D7%AA%D7%97%D7%9C%D7%94.html';
    const extraStories = [
      {
        id: 'story-4',
        title: 'סִפּוּר 4: הַדָּג בַּכַּד',
        emoji: '🐟',
        lines: [
          'דָּג.',
          'דָּג קָטָן.',
          'דָּג קָטָן בַּכַּד.',
          'הַדָּג קָפַץ.',
          'הַדָּג קָפַץ וְקָפַץ.',
          'הַדָּג נָפַל.',
          'דָּן קָם.',
          'דָּן לָקַח דָּג.',
          'הַדָּג חָזַר לַכַּד.',
          'עַכְשָׁו הַדָּג נָח.',
          'דָּן שָׂמַח.'
        ],
        isCustom: false
      },
      {
        id: 'story-5',
        title: 'סִפּוּר 5: הַסַּל שֶׁנָּפַל',
        emoji: '🧺',
        lines: [
          'בַּסַּל חָלָב.',
          'בַּסַּל חַלָּה.',
          'בַּסַּל בָּנָנָה.',
          'סַבָּא הָלַךְ.',
          'הַסַּל נָפַל.',
          'הַחָלָב נָפַל.',
          'הַחַלָּה נָפְלָה.',
          'הַבָּנָנָה נָפְלָה.',
          'גַּל רָץ.',
          'גַּל עָזַר.',
          'הַכַּלְבָּה לָקְחָה בָּנָנָה.',
          'הַכַּלְבָּה בָּרְחָה.'
        ],
        isCustom: false
      },
      {
        id: 'story-6',
        title: 'סִפּוּר 6: נָתָן רָץ בַּגַּן',
        emoji: '🏃',
        lines: [
          'נָתָן רָץ בַּגַּן.',
          'נָתָן נָפַל.',
          'נָתָן בָּכָה.',
          'אַבָּא בָּא.',
          'אַבָּא לָקַח יָד.',
          'נָתָן קָם.',
          'נָתָן רָץ.',
          'נָתָן נָפַל.',
          'נָתָן קָם.',
          'אַבָּא צָחַק.',
          'נָתָן צָחַק.'
        ],
        isCustom: false
      }
    ];

    fetch(sourceUrl)
      .then((response) => {
        if (!response.ok) throw new Error('Could not load the reading book.');
        return response.text();
      })
      .then((html) => {
        const storyData = `\n    const EXTRA_STORIES = ${JSON.stringify(extraStories)};\n`;
        let updatedHtml = html.replace('    const STORAGE_KEYS = {', `${storyData}    const STORAGE_KEYS = {`);
        updatedHtml = updatedHtml.replace(
          '        stories = savedStories ? JSON.parse(savedStories) : [...DEFAULT_STORIES];',
          `        const storedStories = savedStories ? JSON.parse(savedStories) : [...DEFAULT_STORIES];\n        stories = [...storedStories, ...EXTRA_STORIES.filter((extra) => !storedStories.some((story) => story.id === extra.id))];\n        stories = stories.map((story) => ({ ...story, lines: story.lines.flatMap((line) => (line.match(/[^.!?]+[.!?]?/g) || []).map((sentence) => sentence.trim()).filter(Boolean)) }));`
        );
        document.open();
        document.write(updatedHtml);
        document.close();
      })
      .catch(() => {
        document.body.textContent = 'לא הצלחנו לטעון את ספר הקריאה. בדקו את החיבור לאינטרנט ונסו שוב.';
      });
  </script>
</body>
</html>
