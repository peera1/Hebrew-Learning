<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כיתה א | Hebrew Learning</title>
  <style>
    :root { --ink: #263238; --accent: #ff8552; --accent-dark: #d95f32; --paper: #fffdf8; --line: #f0d8bd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: linear-gradient(135deg, #fff4df, #e5f7ef); font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(100%, 680px); padding: 42px 28px; text-align: center; background: var(--paper); border: 2px solid var(--line); border-radius: 24px; box-shadow: 0 16px 40px rgba(53, 42, 28, .12); }
    .back { display: inline-block; margin-bottom: 22px; color: var(--accent-dark); font-weight: 700; text-decoration: none; }
    .badge { font-size: 3rem; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 7vw, 3.2rem); }
    p { margin: 0 auto 28px; max-width: 42ch; line-height: 1.7; }
    .activities { display: grid; gap: 14px; }
    .activity { display: block; padding: 20px; color: var(--ink); border: 2px solid var(--line); border-radius: 16px; background: #fff; text-decoration: none; transition: transform .2s, border-color .2s, box-shadow .2s; }
    .activity:hover, .activity:focus-visible { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 18px rgba(255, 133, 82, .18); }
    .activity strong { display: block; margin-bottom: 6px; color: var(--accent-dark); font-size: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← חזרה לאינדקס הראשי</a>
    <div class="badge" aria-hidden="true">📖</div>
    <h1>כיתה א</h1>
    <p>תרגול קריאה בעברית באמצעות משחק קצר, הקראה ומילים מנוקדות.</p>
    <section class="activities" aria-label="פעילויות לכיתה א">
      <a class="activity" href="קריאת%20מילים.html">
        <strong>🎈 משחק קריאת מילים</strong>
        בוחרים את המילה שנשמעת ומתרגלים קריאה.
      </a>
    </section>
  </main>
</body>
</html>
